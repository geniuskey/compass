[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass"
version = "0.1.0"
description = "Cross-solver Optical Modeling Platform for Advanced Sensor Simulation"
readme = {text = "COMPASS: Cross-solver Optical Modeling Platform for Advanced Sensor Simulation", content-type = "text/plain"}
license = "MIT"
# Keep in sync with ruff.toml target-version, mypy.ini python_version,
# and the CI matrix (.github/workflows/ci.yml).
requires-python = ">=3.11"
authors = [
    { name = "COMPASS Team" },
]

dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.0",
    "h5py>=3.8",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
rcwa = [
    "torcwa>=0.1.4.2",
    "grcwa>=0.1.2",
    "meent>=0.12.0",
    "fmmax>=1.7.1",
    "jax>=0.6.2",
]
fdtd = [
    # flaport FDTD. The other FDTD backends are not pip-installable from here:
    # meep requires conda (conda install -c conda-forge pymeep), and
    # fdtdz / fdtdx follow their upstream install instructions.
    "fdtd>=0.3.5",
]
viz = [
    "pyvista>=0.39",
    "plotly>=5.14",
]
all = [
    "compass[rcwa,fdtd,viz]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["compass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# Linting and type checking are configured in ruff.toml and mypy.ini —
# the single sources of truth. Do not duplicate their settings here:
# ruff prefers ruff.toml and mypy prefers mypy.ini, so [tool.ruff] /
# [tool.mypy] sections in this file would be silently ignored and drift.
