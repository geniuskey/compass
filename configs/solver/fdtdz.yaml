# @package _global_
#
# fdtdz solver configuration
#
# fdtdz is a JAX-based 3D FDTD solver optimized for TPU/GPU.
# The adapter is implemented; the solver package itself must be installed
# separately (see docs/guide/installation).

solver:
  name: "fdtdz"
  type: "fdtd"

  params:
    # Only keys read by compass/solvers/fdtd/fdtdz_solver.py are listed.
    grid_spacing: 0.02          # um per cell
    pml_layers: 15
    dt_factor: 0.5              # time step as a fraction of the Courant limit
    n_timesteps: 2000
    source_offset: 5            # cells between the PML and the source plane
