# @package _global_
#
# fdtdz solver configuration
#
# fdtdz is a JAX-based 3D FDTD solver optimized for TPU/GPU.
# The adapter is implemented; the solver package itself must be installed
# separately (see docs/guide/installation).

solver:
  name: "fdtdz"
  type: "fdtd"

  params:
    grid_spacing: 0.02          # um per cell
    runtime: 200                # femtoseconds
    pml_layers: 15
    courant_number: null        # auto-select based on grid
    dtype: "float32"
    jax_platform: "gpu"         # "cpu", "gpu", or "tpu"
