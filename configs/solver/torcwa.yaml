# @package _global_
solver:
  name: "torcwa"
  type: "rcwa"

  params:
    fourier_order: [5, 5]
    dtype: "complex64"
    n_lens_slices: 30
    grid_multiplier: 3

  stability:
    precision_strategy: "mixed"
    allow_tf32: false
    fourier_factorization: "li_inverse"
    energy_check:
      enabled: true
      tolerance: 0.02
      auto_retry_float64: true
