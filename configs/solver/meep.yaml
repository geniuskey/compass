# @package _global_
#
# Meep solver configuration
#
# Meep is a free, open-source FDTD simulation package (MIT).
# The adapter is implemented; the solver package itself must be installed
# separately (see docs/guide/installation).

solver:
  name: "meep"
  type: "fdtd"

  params:
    # Only keys read by compass/solvers/fdtd/meep_solver.py are listed.
    resolution: 50              # pixels per um
    pml_thickness: 1.0          # um
    runtime_periods: 100        # source periods after the pulse
    use_dispersive: true        # Drude-Lorentz fit of n, k at each wavelength
    air_padding: 0.8            # um of air between the stack and each PML
