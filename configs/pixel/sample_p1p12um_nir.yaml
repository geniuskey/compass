# @package _global_
#
# Sample pixel structure: 1.12 µm pitch NIR-enhanced backside-illuminated pixel.
# See docs/guide/sample-pixels.md and docs/theory/pixel-structure-realism.md for
# the inspiration sources and methodology.
#
# Distinctive realism features modelled here:
# - Pitch = 1.12 µm, conventional Bayer.
# - **Backside inverted-pyramid array (IPA)** etched into the silicon backside
#   for long-wavelength light trapping. The graded silicon fill fraction acts
#   as a moth-eye anti-reflection layer that strongly boosts 700-1000 nm QE.
# - **DTI with a conformal high-k passivation liner** (Al2O3) and a **tapered**
#   sidewall, matching real backside-etched deep trench isolation.
# - **Microlens residual base layer** left by the reflow / etch-back process.
# - Deep (4 µm) silicon to capture near-infrared photons in the photodiode.
pixel:
  pitch: 1.12
  unit_cell: [2, 2]

  layers:
    air:
      thickness: 1.0
      material: "air"

    microlens:
      enabled: true
      height: 0.67
      sharing: 1
      radius_x: 0.54
      radius_y: 0.54
      material: "polymer_n1p56"
      profile:
        type: "superellipse"
        n: 2.5
        alpha: 1.0
      shift:
        mode: "auto_cra"
        cra_deg: 0.0
      gap: 0.04
      base_thickness: 0.10        # residual polymer slab under the curved cap

    planarization:
      thickness: 0.30
      material: "sio2"

    color_filter:
      pattern: "bayer_rggb"
      red:
        material: "cf_red"
        thickness: 0.66
        contact_angle: 66.0
      green:
        material: "cf_green"
        thickness: 0.64
        contact_angle: 72.0
      blue:
        material: "cf_blue"
        thickness: 0.69
        contact_angle: 62.0
      grid:
        enabled: true
        width: 0.08
        thickness: 0.50
        material: "tungsten"

    barl:
      layers:
        - thickness: 0.010
          material: "sio2"
        - thickness: 0.025
          material: "hfo2"
        - thickness: 0.015
          material: "sio2"
        - thickness: 0.030
          material: "si3n4"

    silicon:
      thickness: 4.0              # deep Si for NIR capture
      material: "silicon"
      photodiode:
        position: [0.0, 0.0, 0.3]
        size: [0.85, 0.85, 3.0]
      dti:
        enabled: true
        mode: "fdti"
        width: 0.12
        depth: 4.0
        material: "sio2"
        taper_angle: 82.0         # tapered backside-etched trench
        n_slices: 6
        liner:
          enabled: true
          material: "al2o3"       # high-k passivation liner (negative fixed charge)
          thickness: 0.015
      surface_texture:
        enabled: true
        type: "inverted_pyramid"  # backside light-trapping nanostructure
        height: 0.35
        fill_material: "sio2"
        n_slices: 8

  bayer_map:
    - ["R", "G"]
    - ["G", "B"]
